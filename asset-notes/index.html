<style>
/* Layout: one narrow reading column; each chapter = pretest → bilingual sentences + diagrams/figures → vocab → 3 points */
:root{

  --font-ja:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;

  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121615; --surface:#1a201e; --fg:#e4ebe8; --muted:#9aa8a3; --line:#2c3532;
  --accent:#5cc4ae; --accent-soft:#1d2f2b; --en:#a9c4ec; --warn:#f0a272; --warn-soft:#33241b;
  --ok:#6fd08f; --ng:#ff8a80;
  --art:#e5675a; --vein:#6f9be8; --ure:#f0c440; --organ:#4a3a33; --organ-2:#7a5c4f; --zone:#232a28; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121615; --surface:#1a201e; --fg:#e4ebe8; --muted:#9aa8a3; --line:#2c3532;
  --accent:#5cc4ae; --accent-soft:#1d2f2b; --en:#a9c4ec; --warn:#f0a272; --warn-soft:#33241b;
  --ok:#6fd08f; --ng:#ff8a80;
  --art:#e5675a; --vein:#6f9be8; --ure:#f0c440; --organ:#4a3a33; --organ-2:#7a5c4f; --zone:#232a28; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ja);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:680px;margin:0 auto;padding-block:20px 64px}
h1{font-size:1.5rem;margin:0 0 4px;text-wrap:balance}
.lead{color:var(--muted);font-size:.9rem;margin:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;
  border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;margin-top:16px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn,.chips a{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);
  border-radius:999px;padding:4px 12px;cursor:pointer;text-decoration:none}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.hint{font-size:.8rem;color:var(--muted)}
button:focus-visible,a:focus-visible,.pair:focus-visible,.word:focus-visible,figure:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.chapter{margin-top:36px;scroll-margin-top:120px}
.chno{font-family:var(--font-mono);font-size:.75rem;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.chapter h2{font-size:1.3rem;margin:2px 0 0;line-height:1.4;text-wrap:balance}
.chapter .en-title{font-family:var(--font-en);color:var(--en);font-size:1rem;margin:2px 0 0}
.meta{font-size:.8rem;color:var(--muted);margin:4px 0 0}
h3{font-size:1.05rem;margin:28px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--accent-soft);display:flex;flex-direction:column}
h3 .en{font-family:var(--font-en);font-weight:600;color:var(--en);font-size:.95rem}
h4{font-size:.8rem;letter-spacing:.06em;color:var(--muted);margin:20px 0 6px;font-weight:700}

/* pretest */
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:16px}
.quiz-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.quiz-head strong{font-size:.95rem}
.score{font-family:var(--font-mono);font-size:.8rem;color:var(--muted)}
.levels{display:flex;gap:6px;margin:8px 0 4px;flex-wrap:wrap}
.qlist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.q{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.q:first-child{border-top:0;padding-top:0}
.q-row{display:flex;gap:10px;align-items:flex-start}
.q-text{flex:1;min-width:0}
.ox{display:flex;gap:6px;flex-shrink:0}
.ox button{font:inherit;font-size:1.05rem;font-weight:700;width:44px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.ox button[disabled]{cursor:default;opacity:.55}
.ox button.picked{opacity:1;border-width:2px;border-color:var(--fg)}
.result{font-size:.88rem;border-radius:6px;padding:6px 10px;background:var(--bg)}
.result b.ok{color:var(--ok)} .result b.ng{color:var(--ng)}
.quiz-foot{display:flex;justify-content:flex-end;margin-top:10px}

/* figures & diagrams */
figure{margin:16px 0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
figure img{display:block;width:100%;height:auto}
figure.dg{padding:12px 8px 0}
figure.dg svg{display:block;width:100%;max-width:440px;height:auto;margin:0 auto}
.dg-tag{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.06em;color:var(--accent);padding:0 4px}
figcaption{padding:10px 12px;font-size:.85rem;display:flex;flex-direction:column;gap:4px}
figcaption .en{font-family:var(--font-en);color:var(--en)}
.labels{font-size:.8rem;color:var(--muted)}
svg text{font-family:var(--font-ja);font-size:12px;fill:var(--fg)}
svg .sm{font-size:10.5px} svg .b{font-weight:700} svg .mu{fill:var(--muted)} svg .w{fill:#fff;font-weight:700;font-size:11px}
svg .tw{fill:var(--warn)} svg .ta{fill:var(--accent)}
svg .art-f{fill:var(--art)} svg .vein-f{fill:var(--vein)}
svg .art-s{stroke:var(--art);fill:none;stroke-linecap:round;stroke-linejoin:round}
svg .vein-s{stroke:var(--vein);fill:none;stroke-linecap:round;stroke-linejoin:round}
svg .ure-s{stroke:var(--ure);fill:none;stroke-linecap:round}
svg .organ-f{fill:var(--organ)} svg .organ2-f{fill:var(--organ-2)}
svg .organ-s{stroke:var(--organ-2);fill:none;stroke-linecap:round;stroke-linejoin:round}
svg .frame{fill:none;stroke:var(--line);stroke-width:2}
svg .zone{fill:var(--zone);stroke:var(--line);stroke-width:1.5}
svg .zone-hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.5}
svg .cut{stroke:var(--warn);stroke-width:3;stroke-dasharray:7 5;fill:none}
svg .warn-ring{stroke:var(--warn);stroke-width:2;stroke-dasharray:4 3;fill:none}
svg .lead-l{stroke:var(--warn);stroke-width:1.2;fill:none}
svg .move{stroke:var(--accent);stroke-width:3.5;fill:none;stroke-linecap:round}
svg .mk-a{fill:var(--accent)}

/* bilingual sentences */
.pairs{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.pair{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pair.sub{margin-left:18px}
.pair .en{font-family:var(--font-en);color:var(--en);font-size:1.02rem;line-height:1.6}
.pair .en b{color:var(--fg);font-weight:600;border-bottom:1px dotted var(--muted)}
.pair .ja{font-size:.95rem}
.pair.warn{border-color:var(--warn);background:var(--warn-soft)}
.tag{font-family:var(--font-mono);font-size:.7rem;color:var(--warn);letter-spacing:.06em}
.tap{display:none;font-size:.75rem;color:var(--muted)}

/* hide Japanese: tap an item to reveal */
body.hide-ja .pair,body.hide-ja .word,body.hide-ja figure.photo{cursor:pointer}
body.hide-ja .pair:not(.open) .ja,body.hide-ja figure.photo:not(.open) figcaption .ja,
body.hide-ja .word:not(.open) .ja,body.hide-ja .word:not(.open) .note{display:none}
body.hide-ja .pair:not(.open) .tap,body.hide-ja .word:not(.open) .tap,body.hide-ja figure.photo:not(.open) .tap{display:block}

.vocab{margin:0;padding:0;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.word{display:flex;flex-direction:column;padding:8px 12px;border-top:1px solid var(--line)}
.word:first-child{border-top:0}
.word .en{font-family:var(--font-en);font-weight:600;color:var(--en)}
.word .ja{font-size:.9rem}
.word .note{font-size:.8rem;color:var(--muted)}

.points{background:var(--accent-soft);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.point .k{font-size:.8rem;font-weight:700;color:var(--accent);display:block}
.point ul{margin:2px 0 0;padding-left:1.2em}
.compare{border-left:3px solid var(--accent);padding:2px 0 2px 12px;font-size:.95rem}
.compare p{margin:0 0 8px}
footer{margin-top:48px;font-size:.8rem;color:var(--muted)}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

 {lv:3,q:"右総腸骨静脈を出すために、右総腸骨動脈を離断することがある。",a:true,e:"図解Bのとおり、右総腸骨動脈が静脈の前をふさいでいるため。内腸骨動脈の離断・結紮でも視野が良くなる。"},
 {lv:3,q:"正中アプローチでは、腎血管より「上」で腸間膜根部から後腹膜に入る。",a:false,e:"腎血管より下（below the renal vessels）。左腎静脈が上の境界。"},
 {lv:3,q:"骨盤血管の完全遮断では、遠位大動脈・IVCに加えて左右の「内腸骨」動静脈を遮断する。",a:false,e:"左右の外腸骨（external iliac）動静脈を遮断する。"},
 {lv:3,q:"大動脈にベッセルループを回すときは、腰動静脈（lumbar vessels）を傷つけないよう注意する。",a:true,e:"大動脈の後ろから腰動静脈が出ているため。"}
]
};
const LV_NAME={1:"Lv1 やさしい",2:"Lv2 ふつう",3:"Lv3 むずかしい"};

/* ===== 描画 ===== */
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const TAP='<span class="tap">タップで日本語</span>';
const toc=document.getElementById("toc"), root=document.getElementById("chapters");
let html="", chips="";
for(const c of CHAPTERS){
  chips+=`<a href="#${c.id}">${c.no.replace("Chapter ","")}章 ${esc(c.ja.replace(/^腹部外傷：/,""))}</a>`;
  html+=`<section class="chapter" id="${c.id}"><div class="chno">${c.no}</div><h2>${esc(c.ja)}</h2><p class="en-title">${esc(c.en)}</p><p class="meta">${esc(c.pages)}</p>`;
  if(QUIZ[c.id]) html+=`<div class="quiz" data-ch="${c.id}"><div class="quiz-head"><strong>プレテスト（○×）</strong><span class="score"></span></div>
    <div class="levels" role="group" aria-label="レベル">${[1,2,3].map(l=>`<button class="btn" data-lv="${l}" aria-pressed="false">${LV_NAME[l]}</button>`).join("")}</div>
    <ol class="qlist"></ol><div class="quiz-foot"><button class="btn retry">このレベルをやり直す</button></div></div>`;
  for(const s of c.sections){
    html+=`<h3><span>${esc(s.ja)}</span><span class="en">${esc(s.en)}</span></h3>`;
    if(s.items){html+=`<ul class="pairs">`;for(const it of s.items){
      const cls=["pair",it.warn?"warn":"",it.sub?"sub":""].join(" ");
      const tag=it.step?`<span class="tag">${it.step}</span>`:it.warn?`<span class="tag">注意</span>`:"";
      html+=`<li class="${cls}" tabindex="0">${tag}<span class="en">${it.en}</span><span class="ja">${esc(it.ja)}</span>${TAP}</li>`;}
      html+=`</ul>`;}
    for(const k of s.diagrams||[]){const d=DIAGRAMS[k];
      html+=`<figure class="dg"><span class="dg-tag">${d.tag}　模式図</span>${d.svg}<figcaption>${esc(d.caption)}</figcaption></figure>`;}
    for(const f of s.figures||[]){
      html+=`<figure class="photo" tabindex="0"><img src="${f.src}" alt="${esc(f.ja)}" loading="lazy"><figcaption><span class="en">${esc(f.en)}</span><span class="ja">${esc(f.ja)}</span>${TAP}${f.labels?`<span class="labels">${esc(f.labels)}</span>`:""}</figcaption></figure>`;}
  }
  html+=`<h4>単語 VOCABULARY（${c.vocab.length}語）</h4><ul class="vocab">`;
  for(const [en,ja,note] of c.vocab) html+=`<li class="word" tabindex="0"><span class="en">${esc(en)}</span><span class="ja">${esc(ja)}</span>${note?`<span class="note">${esc(note)}</span>`:""}${TAP}</li>`;
  html+=`</ul><h4>3つのポイント</h4><div class="points">`;
  for(const [k,label] of [["cut","切開線"],["land","ランドマーク"],["protect","守るべき構造"]])
    html+=`<div class="point"><span class="k">${label}</span><ul>${c.points[k].map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
  html+=`</div>`;
  if(c.compare) html+=`<h4>普段の手技との比較</h4><div class="compare">${c.compare.map(x=>`<p>${esc(x)}</p>`).join("")}</div>`;
  html+=`</section>`;
}
toc.innerHTML=chips; root.innerHTML=html;

/* ===== プレテストの動作 ===== */
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function renderQuiz(box,lv){
  const ch=box.dataset.ch, qs=QUIZ[ch].filter(q=>q.lv===lv);
  box.dataset.lv=lv; store.set("lv-"+ch,lv);
  box.querySelectorAll("[data-lv]").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.lv===lv)));
  box.querySelector(".qlist").innerHTML=qs.map((q,i)=>`<li class="q" data-i="${QUIZ[ch].indexOf(q)}"><div class="q-row"><span class="q-text">Q${i+1}. ${esc(q.q)}</span>
    <span class="ox"><button data-ans="1" aria-label="○ 正しい">○</button><button data-ans="0" aria-label="× 誤り">×</button></span></div></li>`).join("");
  updateScore(box);
}
function updateScore(box){
  const items=[...box.querySelectorAll(".q")], done=items.filter(q=>q.dataset.done), ok=done.filter(q=>q.dataset.done==="ok");
  box.querySelector(".score").textContent=`${ok.length}/${items.length} 正解`+(done.length<items.length?`（残り${items.length-done.length}問）`:"");
}
root.addEventListener("click",e=>{
  const box=e.target.closest(".quiz"); if(!box) return;
  const lvb=e.target.closest("button[data-lv]"); if(lvb){renderQuiz(box,+lvb.dataset.lv);return;}
  if(e.target.closest(".retry")){renderQuiz(box,+box.dataset.lv);return;}
  const ab=e.target.closest("[data-ans]"); if(!ab) return;
  const li=ab.closest(".q"); if(li.dataset.done) return;
  const q=QUIZ[box.dataset.ch][+li.dataset.i], right=(ab.dataset.ans==="1")===q.a;
  li.dataset.done=right?"ok":"ng";
  li.querySelectorAll("[data-ans]").forEach(b=>b.disabled=true); ab.classList.add("picked");
  li.insertAdjacentHTML("beforeend",`<div class="result"><b class="${right?"ok":"ng"}">${right?"正解":"不正解"}</b>　答えは ${q.a?"○":"×"}。${esc(q.e)}</div>`);
  updateScore(box);
});
document.querySelectorAll(".quiz").forEach(b=>renderQuiz(b,+(store.get("lv-"+b.dataset.ch)||1)));

/* ===== 日本語を隠す ===== */
const hideBtn=document.getElementById("hide-ja"), hint=document.getElementById("hide-hint");
let hide=store.get("hide-ja")==="1";
function applyHide(){
  document.body.classList.toggle("hide-ja",hide);
  hideBtn.setAttribute("aria-pressed",String(hide));
  hideBtn.textContent=hide?"日本語を表示する":"日本語を隠す";
  hint.textContent=hide?"文や単語をタップすると日本語が出ます":"隠すと、タップしたところだけ日本語が出ます";
  document.querySelectorAll(".open").forEach(e=>e.classList.remove("open"));
  store.set("hide-ja",hide?"1":"0");
}
hideBtn.addEventListener("click",()=>{hide=!hide;applyHide();});
function reveal(e){ if(!hide||e.target.closest(".quiz")) return;
  const el=e.target.closest(".pair,.word,figure.photo"); if(el) el.classList.toggle("open"); }
root.addEventListener("click",reveal);
root.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches(".pair,.word,figure.photo")){e.preventDefault();reveal(e);}});
applyHide();
</script>
