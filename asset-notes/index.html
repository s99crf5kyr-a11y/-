.compare{border-left:3px solid var(--accent);padding:2px 0 2px 12px;font-size:.95rem}

@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
html{scroll-behavior:smooth}

/* ===== 描画 ===== */
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const toc=document.getElementById("toc"), root=document.getElementById("chapters");
let html="", chips="";
for(const c of CHAPTERS){
  chips+=`<a href="#${c.id}">${c.no.replace("Chapter ","")}章 ${esc(c.ja.replace(/^腹部外傷：/,""))}</a>`;
  html+=`<section class="chapter" id="${c.id}"><div class="chno">${c.no}</div><h2>${esc(c.ja)}</h2><p class="en-title">${esc(c.en)}</p><p class="meta">${esc(c.pages)}</p>`;
  for(const s of c.sections){
    html+=`<h3><span>${esc(s.ja)}</span><span class="en">${esc(s.en)}</span></h3>`;
    if(s.items){html+=`<ul class="pairs">`;for(const it of s.items){
      const cls=["pair",it.warn?"warn":"",it.sub?"sub":""].join(" ");
      const tag=it.step?`<span class="tag">${it.step}</span>`:it.warn?`<span class="tag">注意</span>`:"";
      html+=`<li class="${cls}" tabindex="0">${tag}<span class="en">${it.en}</span><span class="ja">${esc(it.ja)}</span></li>`;}
      html+=`</ul>`;}
    for(const f of s.figures||[]){
      html+=`<figure><img src="${f.src}" alt="${esc(f.ja)}" loading="lazy"><figcaption><span class="en">${esc(f.en)}</span><span class="ja">${esc(f.ja)}</span>${f.labels?`<span class="labels">${esc(f.labels)}</span>`:""}</figcaption></figure>`;}
  }
  html+=`<h4>単語 VOCABULARY（${c.vocab.length}語）</h4><ul class="vocab">`;
  for(const [en,ja,note] of c.vocab) html+=`<li class="word" tabindex="0"><span class="en">${esc(en)}</span><span class="ja">${esc(ja)}</span>${note?`<span class="note">${esc(note)}</span>`:""}</li>`;
  html+=`</ul><h4>3つのポイント</h4><div class="points">`;
  for(const [k,label] of [["cut","切開線"],["land","ランドマーク"],["protect","守るべき構造"]])
    html+=`<div class="point"><span class="k">${label}</span><ul>${c.points[k].map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
  html+=`</div>`;
  if(c.compare) html+=`<h4>普段の手技との比較</h4><div class="compare">${c.compare.map(x=>`<p>${esc(x)}</p>`).join("")}</div>`;
  html+=`</section>`;
}
toc.innerHTML=chips; root.innerHTML=html;

/* ===== 表示モード ===== */
const body=document.body, btns=[...document.querySelectorAll(".modes button")];
let mode="both", quiz=false;
try{mode=localStorage.getItem("mode")||"both";quiz=localStorage.getItem("quiz")==="1";}catch(e){}
function apply(){
  body.classList.toggle("mode-en",mode==="en");body.classList.toggle("mode-ja",mode==="ja");body.classList.toggle("quiz",quiz);
  for(const b of btns) b.setAttribute("aria-pressed", b.dataset.quiz? String(quiz) : String(b.dataset.mode===mode));
  document.querySelectorAll(".open").forEach(e=>e.classList.remove("open"));
  try{localStorage.setItem("mode",mode);localStorage.setItem("quiz",quiz?"1":"0");}catch(e){}
}
btns.forEach(b=>b.addEventListener("click",()=>{ if(b.dataset.quiz) quiz=!quiz; else mode=b.dataset.mode; apply(); }));
function toggleOpen(e){const el=e.target.closest(".pair,.word"); if(!el) return;
  if(el.classList.contains("pair")&&mode!=="en") return;
  if(el.classList.contains("word")&&!quiz) return;
  el.classList.toggle("open");}
root.addEventListener("click",toggleOpen);
root.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggleOpen(e);}});
apply();
</script>
