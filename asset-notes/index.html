<title>ASSET対訳ノート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: textbook page (running header, maroon title, navy headings, square bullets, red-label figures) in one column; study tools sit outside the page */
:root{
  --bg:#eef0ee; --paper:#fdfdfb; --fg:#1d2321; --muted:#5f6b67; --line:#dde1df;
  --maroon:#7b2230; --navy:#1f3a5f; --bullet:#4a6a96; --rule:#b3404f;
  --ja:#3c5a52; --ja-bg:#eef5f2; --gloss:#0f6b5c; --gloss-bg:#dff0ea;
  --accent:#0f6b5c; --accent-soft:#e2f0ec; --warn:#a14a1c; --warn-soft:#fbeee6; --supp:#f3f1ea; --supp-line:#cfc6ad;
  --ok:#1e7a3c; --ng:#b3261e;
  --art:#c0392b; --vein:#2f5fb3; --ure:#c08a00; --organ:#ead7cb; --organ-2:#c9a593; --zone:#e9ecea;
  --font-en:"Source Sans 3","Myriad Pro","Helvetica Neue",Arial,sans-serif;
  --font-ja:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1312; --paper:#181d1c; --fg:#e4ebe8; --muted:#9aa8a3; --line:#2c3532;
  --maroon:#f08a96; --navy:#a9c4ec; --bullet:#8fb0dc; --rule:#c46a76;
  --ja:#a8d3c6; --ja-bg:#1c2a26; --gloss:#7fe0c8; --gloss-bg:#1d332d;
  --accent:#5cc4ae; --accent-soft:#1d2f2b; --warn:#f0a272; --warn-soft:#33241b; --supp:#22241f; --supp-line:#4d4838;
  --ok:#6fd08f; --ng:#ff8a80;
  --art:#e5675a; --vein:#6f9be8; --ure:#f0c440; --organ:#4a3a33; --organ-2:#7a5c4f; --zone:#232a28; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1312; --paper:#181d1c; --fg:#e4ebe8; --muted:#9aa8a3; --line:#2c3532;
  --maroon:#f08a96; --navy:#a9c4ec; --bullet:#8fb0dc; --rule:#c46a76;
  --ja:#a8d3c6; --ja-bg:#1c2a26; --gloss:#7fe0c8; --gloss-bg:#1d332d;
  --accent:#5cc4ae; --accent-soft:#1d2f2b; --warn:#f0a272; --warn-soft:#33241b; --supp:#22241f; --supp-line:#4d4838;
  --ok:#6fd08f; --ng:#ff8a80;
  --art:#e5675a; --vein:#6f9be8; --ure:#f0c440; --organ:#4a3a33; --organ-2:#7a5c4f; --zone:#232a28; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ja);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-block:16px 64px}
button{font:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* toolbar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.btn,.chips a{font-size:.82rem;border:1px solid var(--line);background:var(--paper);color:var(--fg);border-radius:999px;padding:3px 11px;cursor:pointer;text-decoration:none;line-height:1.6}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips a{font-family:var(--font-en);color:var(--navy)}

/* the textbook page */
.page{background:var(--paper);border:1px solid var(--line);border-radius:4px;margin-top:14px;padding:18px 18px 22px 26px;position:relative;font-family:var(--font-en)}
.page::before{content:"";position:absolute;left:12px;top:14px;bottom:14px;width:1.5px;background:var(--rule);opacity:.7}
.runhead{font-size:.78rem;color:var(--muted);margin:0 0 14px;line-height:1.4}
.runfoot{font-size:.85rem;color:var(--muted);margin:26px 0 0;border-top:1px solid var(--line);padding-top:8px}
.runfoot i{font-weight:700;color:var(--fg)}
h1.title{font-family:var(--font-en);color:var(--maroon);font-weight:700;font-size:1.65rem;line-height:1.2;margin:0;text-wrap:balance}
.hja{display:block;font-family:var(--font-ja);font-size:.82rem;font-weight:500;color:var(--ja);margin-top:4px;line-height:1.5}
h2.sec{font-family:var(--font-en);color:var(--navy);font-weight:700;font-size:1.3rem;margin:26px 0 8px;line-height:1.25;scroll-margin-top:110px}
h3.sub{font-family:var(--font-en);color:var(--bullet);font-weight:700;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 6px}
.en-p{font-size:1.06rem;line-height:1.5;margin:0}
.blk{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.items li{position:relative;padding-left:20px}
.items.bul>li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;background:var(--bullet)}
.items.num{counter-reset:n}
.items.num>li{counter-increment:n}
.items.num>li::before{content:counter(n) ".";position:absolute;left:0;top:0;font-weight:700;color:var(--navy);font-size:1.06rem;line-height:1.5}
.items li.sub{margin-left:22px}
.items li.sub::before{width:5px;height:5px;border-radius:50%;background:var(--muted)}
.items li.warn .en-p{background:linear-gradient(transparent 62%,var(--warn-soft) 62%)}
.step{display:inline-block;font-family:var(--font-mono);font-size:.68rem;color:var(--warn);letter-spacing:.06em;margin-bottom:2px}
.en-p strong{font-weight:700}

/* Japanese under each sentence */
.ja{font-family:var(--font-ja);font-size:.88rem;line-height:1.65;color:var(--ja);background:var(--ja-bg);border-radius:4px;padding:4px 8px;margin-top:4px}
.ja-btn{display:none;align-self:flex-start;font-size:.75rem;border:1px dashed var(--ja);color:var(--ja);background:transparent;border-radius:4px;padding:0 8px;cursor:pointer;margin-top:4px}
body.hide-ja .blk:not(.open) .ja{display:none}
body.hide-ja .blk:not(.open) .ja-btn{display:inline-block}

/* tappable terms with inline gloss */
.term{all:unset;cursor:pointer;border-bottom:1.5px dotted var(--bullet);border-radius:2px}
.term:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.term.on{background:var(--gloss-bg)}
.gloss{display:none;font-family:var(--font-ja);font-size:.78em;font-weight:500;color:var(--gloss);background:var(--gloss-bg);border-radius:3px;padding:0 4px;margin:0 2px;white-space:nowrap;text-transform:none;letter-spacing:0}
.term.on+.gloss,body.all-gloss .gloss{display:inline}

/* figures */
figure{margin:16px 0}
figure.photo img{display:block;width:100%;height:auto;border:1px solid var(--line)}
figcaption{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.figlab{font-weight:700;color:var(--maroon)}
.cap-en{font-size:.95rem;line-height:1.45}
.labels{font-family:var(--font-ja);font-size:.78rem;color:var(--muted)}
.missing{font-family:var(--font-ja);font-size:.8rem;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:8px 10px;margin:14px 0}

/* study diagrams (not from the textbook) */
figure.dg{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 8px 0}
figure.dg svg{display:block;width:100%;max-width:440px;height:auto;margin:0 auto}
figure.dg figcaption{font-family:var(--font-ja);font-size:.82rem;padding:6px 6px 10px}
.dg-tag{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.06em;color:var(--accent);padding:0 4px}

/* supplement from chapter 15 */
.supp{background:var(--supp);border:1px solid var(--supp-line);border-radius:6px;padding:12px 14px;margin:14px 0 4px 0}
.supp-tag{font-family:var(--font-ja);font-size:.75rem;font-weight:700;color:var(--warn);letter-spacing:.04em}
.supp h2.sec{font-size:1.12rem;margin:4px 0 6px}

/* study tools outside the page */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:14px;scroll-margin-top:110px}
.panel h2{font-size:1rem;margin:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.score{font-family:var(--font-mono);font-size:.8rem;color:var(--muted)}
.levels{display:flex;gap:6px;margin:8px 0 4px;flex-wrap:wrap}
.qlist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.q{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.q:first-child{border-top:0;padding-top:0}
.q-row{display:flex;gap:10px;align-items:flex-start}
.q-text{flex:1;min-width:0}
.ox{display:flex;gap:6px;flex-shrink:0}
.ox button{font-size:1.05rem;font-weight:700;width:44px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.ox button[disabled]{cursor:default;opacity:.55}
.ox button.picked{opacity:1;border-width:2px;border-color:var(--fg)}
.result{font-size:.88rem;border-radius:6px;padding:6px 10px;background:var(--bg)}
.result b.ok{color:var(--ok)} .result b.ng{color:var(--ng)}
.quiz-foot{display:flex;justify-content:flex-end;margin-top:10px}
.points{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.point .k{font-size:.8rem;font-weight:700;color:var(--accent);display:block}
.point ul{margin:2px 0 0;padding-left:1.2em}
.compare p{margin:0 0 6px;font-size:.95rem}
.vocab{margin:8px 0 0;padding:0;list-style:none}
.word{display:flex;flex-wrap:wrap;gap:2px 10px;padding:6px 0;border-top:1px solid var(--line)}
.word:first-child{border-top:0}
.word .w-en{font-family:var(--font-en);font-weight:600;color:var(--navy)}
.word .w-ja{font-size:.9rem}
body.hide-ja .word{cursor:pointer}
body.hide-ja .word:not(.open) .w-ja{visibility:hidden}
footer{margin-top:36px;font-size:.8rem;color:var(--muted)}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
<style>
svg text{font-family:var(--font-ja);font-size:12px;fill:var(--fg)}
svg .sm{font-size:10.5px} svg .b{font-weight:700} svg .mu{fill:var(--muted)} svg .w{fill:#fff;font-weight:700;font-size:11px}
svg .tw{fill:var(--warn)} svg .ta{fill:var(--accent)}
svg .art-f{fill:var(--art)} svg .vein-f{fill:var(--vein)}
svg .art-s{stroke:var(--art);fill:none;stroke-linecap:round;stroke-linejoin:round}
svg .vein-s{stroke:var(--vein);fill:none;stroke-linecap:round;stroke-linejoin:round}
svg .ure-s{stroke:var(--ure);fill:none;stroke-linecap:round}
svg .organ-f{fill:var(--organ)} svg .organ2-f{fill:var(--organ-2)}
svg .organ-s{stroke:var(--organ-2);fill:none;stroke-linecap:round;stroke-linejoin:round}
svg .frame{fill:none;stroke:var(--line);stroke-width:2}
svg .zone{fill:var(--zone);stroke:var(--line);stroke-width:1.5}
svg .zone-hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.5}
svg .cut{stroke:var(--warn);stroke-width:3;stroke-dasharray:7 5;fill:none}
svg .warn-ring{stroke:var(--warn);stroke-width:2;stroke-dasharray:4 3;fill:none}
svg .lead-l{stroke:var(--warn);stroke-width:1.2;fill:none}
svg .move{stroke:var(--accent);stroke-width:3.5;fill:none;stroke-linecap:round}
svg .mk-a{fill:var(--accent)}

</style>

<div class="wrap">
  <div class="bar">
    <div class="tools">
      <button class="btn" id="hide-ja" aria-pressed="false">文の訳を隠す</button>
      <button class="btn" id="all-gloss" aria-pressed="false">語の意味をすべて表示</button>
    </div>
    <nav class="chips" aria-label="目次">
      <a href="#pretest">プレテスト</a><a href="#s-cons">Considerations</a><a href="#s-op">Operative Exposure</a>
      <a href="#s-aorta">Distal Aorta</a><a href="#s-iliac">Iliac Vessels</a><a href="#memo">まとめ</a>
    </nav>
  </div>

  <section class="panel" id="pretest">
    <div class="panel-head"><h2>プレテスト（○×）</h2><span class="score"></span></div>
    <div class="levels" role="group" aria-label="レベル">
      <button class="btn" data-lv="1" aria-pressed="false">Lv1 やさしい</button>
      <button class="btn" data-lv="2" aria-pressed="false">Lv2 ふつう</button>
      <button class="btn" data-lv="3" aria-pressed="false">Lv3 むずかしい</button>
    </div>
    <ol class="qlist"></ol>
    <div class="quiz-foot"><button class="btn" id="retry">このレベルをやり直す</button></div>
  </section>

  <article class="page" id="page"></article>

  <section class="panel" id="memo">
    <h2>まとめ：3つのポイント</h2>
    <div class="points" id="points"></div>
    <h2 style="margin-top:16px">普段の手技との比較</h2>
    <div class="compare" id="compare"></div>
    <h2 style="margin-top:16px">単語一覧 <span class="score" id="vcount"></span></h2>
    <ul class="vocab" id="vocab"></ul>
  </section>

  <footer>
    <p>本文の点線の語をタップすると、その横に日本語が出ます。プレテストは読む前と読んだあとに解くのがおすすめです。「図解」は学習用に描いた簡略図で、教科書の図ではありません。</p>
    <p>教科書の内容と写真を含むため、他の人には共有しないでください。</p>
  </footer>
</div>
<script>
/* 書式： {英語|日本語} はタップで意味が出る語。**太字** は教科書の太字。 */
const PAGE = {
runhead:"Operative Exposure in Abdominal Trauma: Exposure of the Distal Aorta and Iliac Vessels",
title:{en:"{Operative Exposure|手術展開} in {Abdominal Trauma|腹部外傷}: Exposure of the {Distal Aorta|遠位大動脈} and {Iliac Vessels|腸骨血管}", ja:"腹部外傷における手術展開：遠位大動脈と腸骨血管の展開（19章 p161〜166）"},
blocks:[
 {t:"p", en:"This chapter will discuss the key {vascular exposures|血管の展開} that will be {potentially lifesaving|救命につながりうる} for patients with injury to or {rupture|破裂} of their distal aorta or iliac artery or vein.",
  ja:"この章では、遠位大動脈や腸骨動脈・腸骨静脈の損傷・破裂がある患者で、救命につながりうる主要な血管の展開法を扱う。"},

 {t:"h", id:"s-obj", en:"{Learning Objectives|学習目標}", ja:"学習目標"},
 {t:"p", en:"By the end of the ASSET course, {participants|受講者} should be able to do the following:", ja:"ASSETコースを終えるまでに、受講者は次のことができるようになる。"},
 {t:"ol", items:[
  {en:"{Describe|説明する} and {demonstrate|実際にやってみせる} the steps to obtain {vascular control|血管制御（出血を止められる状態）} of the {distal|遠位の} aorta.", ja:"遠位大動脈の血管制御を得る手順を説明し、実際にやってみせる。"},
  {en:"Describe and demonstrate the steps to obtain exposure of the right and left {iliac|腸骨の} arteries and veins.", ja:"左右の腸骨動脈・腸骨静脈を展開する手順を説明し、実際にやってみせる。"}
 ]},

 {t:"h", id:"s-cons", en:"{Considerations|留意点}", ja:"留意点"},
 {t:"ul", items:[
  {en:"The distal aorta and the iliac vessels are located in {retroperitoneal|後腹膜の} Zones 1 and 3 (chapter 15), {respectively|それぞれ}. When injured, they can {present|呈する} {life-threatening|命に関わる} {hemorrhage|出血}, with an associated high {mortality rate|死亡率}.",
   ja:"遠位大動脈は後腹膜Zone 1、腸骨血管はZone 3にある（15章）。損傷すると命に関わる出血を起こし、死亡率が高い。"},
  {en:"{Penetrating wounds|穿通性外傷} to the pelvis are the most common causes of distal aorta and iliac vessel injuries.",
   ja:"遠位大動脈・腸骨血管損傷の原因でいちばん多いのは、骨盤の穿通性外傷である。"},
  {en:"Iliac vein injuries result in significant {blood loss|出血量}, and operative exposure is difficult. These veins may be {ligated|結紮される} if necessary. {Ligation|結紮} of the external iliac vein {distal to the bifurcation|分岐部より末梢で} will {place the patient at risk of|〜のリスクにさらす} developing lower extremity {edema|浮腫} and/or {deep venous thrombosis|深部静脈血栓症（DVT）}.",
   ja:"腸骨静脈損傷は出血量が多く、展開も難しい。必要ならこれらの静脈は結紮してよい。ただし外腸骨静脈を分岐部より末梢で結紮すると、下肢の浮腫やDVTが起こりうる。"},
  {en:"The first {priority|優先事項} is hemorrhage control.", ja:"最優先は出血のコントロールである。"},
  {warn:true, en:"{Ureteral|尿管の} injuries are commonly {associated with|〜に合併する} iliac vessel injuries, and therefore the ureter should be {evaluated|評価される} after the vascular injuries have been {addressed|対処される}.",
   ja:"尿管損傷は腸骨血管損傷によく合併する。したがって、血管損傷に対処したあとで尿管を評価すること。"}
 ]},
 {t:"dg", key:"zones"},

 {t:"h", id:"s-op", en:"{Operative Exposure|手術展開}", ja:"手術展開"},
 {t:"ul", items:[
  {en:"Distal aorta and iliac vessel injuries are {typically|通常は} exposed through a {midline incision|正中切開} as part of a {trauma laparotomy|外傷開腹}.",
   ja:"遠位大動脈・腸骨血管の損傷は、通常は外傷開腹の一部として正中切開から展開する。"},
  {en:"Understanding the {anatomic relationships|解剖学的な位置関係} of the distal aorta and iliac vessels is {critical|極めて重要} to obtaining safe and rapid control. Remember that the iliac arteries are **{anterior|前方に}** to their {corresponding|対応する} veins.",
   ja:"安全かつ迅速に制御するには、遠位大動脈と腸骨血管の位置関係を理解しておくことが極めて重要である。腸骨動脈は、対応する静脈より前にあることを覚えておく。"},
  {en:"As {outlined|述べた} in chapter 15, right-to-left {medial visceral rotation|内側臓器翻転} (Cattell-Braasch maneuver) can be performed rapidly and allows for the colon and small bowel to be {mobilized|授動される} up and off the distal aorta, {inferior vena cava|下大静脈（IVC）}, and iliac vessels (Figures 1 and 2).",
   ja:"15章で述べたとおり、右から左への内側臓器翻転（Cattell-Braasch法）は素早く行え、結腸と小腸を遠位大動脈・IVC・腸骨血管の上からよけられる（図1・2）。",
   supp:true},
  {warn:true, en:"The common iliac veins are {intimately adherent|密に癒着している} to the {back wall|後壁} of the common iliac arteries. If not careful, mobilization of the artery may result in venous injury and {profuse bleeding|大量出血}. The right common iliac vein and bifurcation are particularly difficult to expose.",
   ja:"総腸骨静脈は総腸骨動脈の後壁に密着している。不用意に動脈を授動すると、静脈を損傷して大出血になることがある。特に右総腸骨静脈と分岐部は展開が難しい。"},
  {en:"{Occasionally|ときに}, it may be necessary to {transect|離断する} the right common iliac artery to gain {adequate|十分な} exposure of the right common iliac vein, as {depicted|示された} in Figures 3 and 4. Transection and ligation of the {internal iliac artery|内腸骨動脈} can also improve exposure of the {ipsilateral|同側の} common iliac vein.",
   ja:"右総腸骨静脈を十分に展開するため、右総腸骨動脈を離断しなければならないこともある（図3・4）。内腸骨動脈を離断・結紮しても、同側の総腸骨静脈が見やすくなる。"},
  {sub:true, en:"{Excessive|過度の} {retraction|牽引} of the {external iliac artery|外腸骨動脈} to obtain better exposure of this vein may damage the artery.",
   ja:"この静脈をよく見ようとして外腸骨動脈を引っぱりすぎると、動脈を傷めることがある。"}
 ]},
 {t:"dg", key:"bif"},
 {t:"dg", key:"xsec"},
 {t:"missing", text:"教科書の図1〜4（p163〜164）はまだ撮影されていません。写真を送ってもらえればここに入れます。"},

/* ===== 描画 ===== */
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const VOCAB=new Map();
function rich(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\{([^|{}]+)\|([^{}]+)\}/g,(m,en,ja)=>{
    const k=en.toLowerCase(); if(!VOCAB.has(k)) VOCAB.set(k,[en,ja]);
    return `<button class="term" type="button" aria-expanded="false">${en}</button><span class="gloss">${ja}</span>`;});
}
const sentence=(en,ja,extra="")=>`<div class="blk">${extra}<p class="en-p">${rich(en)}</p><div class="ja">${esc(ja)}</div><button class="ja-btn" type="button">訳を見る</button></div>`;
function blocks(list){
  let h="";
  for(const b of list){
    if(b.t==="p") h+=sentence(b.en,b.ja);
    else if(b.t==="h") h+=`<h2 class="sec"${b.id?` id="${b.id}"`:""}>${rich(b.en)}<span class="hja">${esc(b.ja)}</span></h2>`;
    else if(b.t==="h3") h+=`<h3 class="sub">${rich(b.en)}</h3>`;
    else if(b.t==="ul"||b.t==="ol"){
      h+=`<ul class="items ${b.t==="ol"?"num":"bul"}">`;
      for(const it of b.items){
        const cls=[it.warn?"warn":"",it.sub?"sub":""].join(" ").trim();
        h+=`<li${cls?` class="${cls}"`:""}>${sentence(it.en,it.ja,it.step?`<span class="step">${it.step}</span>`:"")}${it.supp?supp():""}</li>`;
      }
      h+=`</ul>`;
    }
    else if(b.t==="dg"){const d=DIAGRAMS[b.key];h+=`<figure class="dg"><span class="dg-tag">${d.tag}　学習用の模式図</span>${d.svg}<figcaption>${esc(d.caption)}</figcaption></figure>`;}
    else if(b.t==="fig") h+=`<figure class="photo"><img src="${b.src}" alt="${esc(b.ja)}" loading="lazy"><figcaption>${sentence(`**${b.lab}** `+b.en,b.ja)}<span class="labels">${esc(b.labels)}</span></figcaption></figure>`;
    else if(b.t==="missing") h+=`<p class="missing">${esc(b.text)}</p>`;
  }
  return h;
}
function supp(){return `<aside class="supp"><div class="supp-tag">${esc(SUPP.tag)}</div><h2 class="sec">${rich(SUPP.title.en)}<span class="hja">${esc(SUPP.title.ja)}</span></h2>${blocks(SUPP.blocks)}</aside>`;}
document.getElementById("page").innerHTML=
  `<p class="runhead">${esc(PAGE.runhead)}</p><h1 class="title">${rich(PAGE.title.en)}<span class="hja">${esc(PAGE.title.ja)}</span></h1>`+
  blocks(PAGE.blocks)+`<p class="runfoot">Exposure Techniques <i>When Time Matters</i></p>`;
document.getElementById("points").innerHTML=[["cut","切開線"],["land","ランドマーク"],["protect","守るべき構造"]]
  .map(([k,l])=>`<div class="point"><span class="k">${l}</span><ul>${MEMO.points[k].map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`).join("");
document.getElementById("compare").innerHTML=MEMO.compare.map(x=>`<p>${esc(x)}</p>`).join("");
document.getElementById("vocab").innerHTML=[...VOCAB.values()].map(([en,ja])=>`<li class="word" tabindex="0"><span class="w-en">${en}</span><span class="w-ja">${ja}</span></li>`).join("");
document.getElementById("vcount").textContent=`${VOCAB.size}語`;

/* ===== タップで語の意味 / 文の訳 ===== */
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
document.addEventListener("click",e=>{
  const t=e.target.closest(".term");
  if(t){t.classList.toggle("on");t.setAttribute("aria-expanded",String(t.classList.contains("on")));return;}
  const jb=e.target.closest(".ja-btn"); if(jb){jb.closest(".blk").classList.add("open");return;}
  const w=e.target.closest(".word"); if(w&&document.body.classList.contains("hide-ja")) w.classList.toggle("open");
});
const hideBtn=document.getElementById("hide-ja"), glossBtn=document.getElementById("all-gloss");
let hide=store.get("hide-ja")==="1", allGloss=store.get("all-gloss")==="1";
function applyToggles(){
  document.body.classList.toggle("hide-ja",hide); document.body.classList.toggle("all-gloss",allGloss);
  hideBtn.setAttribute("aria-pressed",String(hide)); hideBtn.textContent=hide?"文の訳を表示":"文の訳を隠す";
  glossBtn.setAttribute("aria-pressed",String(allGloss));
  document.querySelectorAll(".open").forEach(x=>x.classList.remove("open"));
  store.set("hide-ja",hide?"1":"0"); store.set("all-gloss",allGloss?"1":"0");
}
hideBtn.addEventListener("click",()=>{hide=!hide;applyToggles();});
glossBtn.addEventListener("click",()=>{allGloss=!allGloss;applyToggles();});
applyToggles();

/* ===== プレテスト ===== */
const quiz=document.getElementById("pretest");
let curLv=+(store.get("lv-ch19")||1);
function renderQuiz(lv){
  curLv=lv; store.set("lv-ch19",lv);
  quiz.querySelectorAll("button[data-lv]").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.lv===lv)));
  const qs=QUIZ.filter(q=>q.lv===lv);
  quiz.querySelector(".qlist").innerHTML=qs.map((q,i)=>`<li class="q" data-i="${QUIZ.indexOf(q)}"><div class="q-row"><span class="q-text">Q${i+1}. ${esc(q.q)}</span>
    <span class="ox"><button data-ans="1" aria-label="○ 正しい">○</button><button data-ans="0" aria-label="× 誤り">×</button></span></div></li>`).join("");
  score();
}
function score(){
  const items=[...quiz.querySelectorAll(".q")],done=items.filter(q=>q.dataset.done),ok=done.filter(q=>q.dataset.done==="ok");
  quiz.querySelector(".score").textContent=`${ok.length}/${items.length} 正解`+(done.length<items.length?`（残り${items.length-done.length}問）`:"");
}
quiz.addEventListener("click",e=>{
  const lvb=e.target.closest("button[data-lv]"); if(lvb){renderQuiz(+lvb.dataset.lv);return;}
  if(e.target.closest("#retry")){renderQuiz(curLv);return;}
  const ab=e.target.closest("[data-ans]"); if(!ab) return;
  const li=ab.closest(".q"); if(li.dataset.done) return;
  const q=QUIZ[+li.dataset.i], right=(ab.dataset.ans==="1")===q.a;
  li.dataset.done=right?"ok":"ng"; li.querySelectorAll("[data-ans]").forEach(b=>b.disabled=true); ab.classList.add("picked");
  li.insertAdjacentHTML("beforeend",`<div class="result"><b class="${right?"ok":"ng"}">${right?"正解":"不正解"}</b>　答えは ${q.a?"○":"×"}。${esc(q.e)}</div>`);
  score();
});
renderQuiz(curLv);
</script>
